<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0a6c8c">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="دفتر الوايتات">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>دفتر الوايتات</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Noto+Kufi+Arabic:wght@600;800&display=swap">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font-size:14px}img{max-width:100%}[hidden]{display:none!important}</style>
<style>
/* Layout: one phone-width column, sticky header, fixed bottom tabs, every form opens as a bottom sheet */
:root{
  --bg:#edf2f4; --surface:#ffffff; --surface-2:#f4f7f8; --ink:#0d2830; --muted:#5a6f78; --line:#d5e0e4;
  --water:#0a6c8c; --water-ink:#ffffff; --water-soft:#d9ecf2;
  --owed:#9a5208; --owed-soft:#fbeed8; --ok:#14744a; --ok-soft:#dcf2e6; --bad:#b42318; --bad-soft:#fde4e1;
  --bar-2:#9fb3bb;
  --font-display:'Noto Kufi Arabic','IBM Plex Sans Arabic',system-ui,sans-serif;
  --font-body:'IBM Plex Sans Arabic',system-ui,-apple-system,'Segoe UI',Tahoma,sans-serif;
  --r:14px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0a181d; --surface:#10262e; --surface-2:#0d1f26; --ink:#e3edf0; --muted:#94a9b2; --line:#22404a;
  --water:#3aa7cc; --water-ink:#04212a; --water-soft:#123845;
  --owed:#f0a84c; --owed-soft:#3a2912; --ok:#4cc38a; --ok-soft:#113325; --bad:#ff8b7b; --bad-soft:#3d1a15;
  --bar-2:#4d6670; color-scheme:dark;}}
:root[data-theme="dark"]{
  --bg:#0a181d; --surface:#10262e; --surface-2:#0d1f26; --ink:#e3edf0; --muted:#94a9b2; --line:#22404a;
  --water:#3aa7cc; --water-ink:#04212a; --water-soft:#123845;
  --owed:#f0a84c; --owed-soft:#3a2912; --ok:#4cc38a; --ok-soft:#113325; --bad:#ff8b7b; --bad-soft:#3d1a15;
  --bar-2:#4d6670; color-scheme:dark;}

html,body{background:var(--bg)}
body{color:var(--ink);font-family:var(--font-body);font-size:16px;line-height:1.55;-webkit-tap-highlight-color:transparent}
#app{direction:rtl;text-align:right}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
button:disabled{cursor:not-allowed}
:focus-visible{outline:3px solid var(--water);outline-offset:2px}
.num,.amt,.big,td{font-variant-numeric:tabular-nums}
[dir="ltr"]{unicode-bidi:isolate}

body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:40;background:var(--surface)}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;background:var(--surface);border-bottom:1px solid var(--line)}
.top-in{max-width:620px;margin:0 auto;display:flex;align-items:center;gap:10px;padding-block:10px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.brand{flex:1;min-width:0;display:flex;align-items:center;gap:8px;font-family:var(--font-display);font-weight:800;font-size:19px;color:var(--water)}
.brand svg{width:22px;height:22px;flex:none}
.sync{display:flex;align-items:center;gap:6px;background:var(--surface-2);border:1px solid var(--line);border-radius:999px;padding:5px 11px;font-size:13px;white-space:nowrap}
.sync i{width:8px;height:8px;border-radius:50%;background:var(--ok);flex:none}
.sync.pending i{background:var(--owed)} .sync.off i{background:var(--bad)} .sync.demo i{background:var(--owed)}
.banner{max-width:620px;margin:0 auto;font-size:12.5px;color:var(--owed);background:var(--owed-soft);text-align:center;padding-block:4px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

.wrap{max-width:620px;margin:0 auto;display:flex;flex-direction:column;gap:16px;padding-block:14px 170px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h2,h3{font-family:var(--font-display);font-weight:800;margin:0;text-wrap:balance}
h2{font-size:19px} h3{font-size:16px}
.muted{color:var(--muted)} .sub{font-size:13px;color:var(--muted)}
.owedc{color:var(--owed)} .okc{color:var(--ok)} .badc{color:var(--bad)}

.hello{display:flex;justify-content:space-between;align-items:baseline;gap:8px;flex-wrap:wrap}
.hello .date{font-family:var(--font-display);font-weight:800;font-size:20px}
.tiles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.tiles.two{grid-template-columns:repeat(2,minmax(0,1fr))}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px;display:flex;flex-direction:column;gap:2px;min-width:0;text-align:right}
.tile .k{font-size:13px;color:var(--muted)}
.tile .big{font-family:var(--font-display);font-weight:800;font-size:23px;line-height:1.3}
.tile .s{font-size:12.5px;color:var(--muted)}
.tile.owed .big{color:var(--owed)} .tile.good .big{color:var(--ok)}
button.tile{font:inherit}

.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.card-h{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:12px 14px;border-bottom:1px solid var(--line)}
.card-b{padding:14px;display:flex;flex-direction:column;gap:12px}
.count{background:var(--bad-soft);color:var(--bad);border-radius:999px;padding:0 9px;font-weight:700;font-size:13px}
ul.list{list-style:none;margin:0;padding:0}
ul.list>li+li{border-top:1px solid var(--line)}
.row{width:100%;display:flex;align-items:center;gap:12px;padding:12px 14px;background:none;border:0;text-align:right;min-height:58px}
button.row:hover{background:var(--surface-2)}
.row .time{font-size:13px;color:var(--muted);width:60px;flex:none;font-variant-numeric:tabular-nums}
.row .main{flex:1;min-width:0;display:flex;flex-direction:column}
.row .main b{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .main small{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--muted);font-size:13px}
.row .amt{display:flex;flex-direction:column;align-items:flex-start;gap:3px;font-weight:700;flex:none}
.code{font-family:var(--font-display);font-weight:800;letter-spacing:.04em;font-variant-numeric:tabular-nums}
.strike{text-decoration:line-through;color:var(--muted)}
.empty{padding:18px 14px;color:var(--muted);text-align:center}
.chip{display:inline-flex;align-items:center;gap:4px;border-radius:999px;padding:1px 9px;font-size:12px;font-weight:600;white-space:nowrap}
.c-ok{background:var(--ok-soft);color:var(--ok)} .c-water{background:var(--water-soft);color:var(--water)}
.c-owed{background:var(--owed-soft);color:var(--owed)} .c-bad{background:var(--bad-soft);color:var(--bad)}
.c-mute{background:var(--surface-2);color:var(--muted);border:1px solid var(--line)}
.dot{width:10px;height:10px;border-radius:50%;flex:none}
.dot.bad{background:var(--bad)} .dot.warn{background:var(--owed)} .dot.info{background:var(--water)}
.more{width:100%;background:none;border:0;border-top:1px solid var(--line);padding:11px;color:var(--water);font-weight:600}
.quick{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.quick button{min-height:54px;border-radius:12px;border:1.5px solid var(--line);background:var(--surface);font-weight:700;font-size:14.5px;padding:6px}

.fab{position:fixed;z-index:25;left:50%;transform:translateX(-50%);bottom:calc(74px + env(safe-area-inset-bottom,0px));
  display:flex;align-items:center;gap:8px;background:var(--water);color:var(--water-ink);border:0;border-radius:999px;
  padding:14px 28px;font-family:var(--font-display);font-weight:800;font-size:17px;box-shadow:0 8px 24px rgba(5,40,52,.28)}
.fab svg{width:20px;height:20px}
.nav{position:fixed;inset:auto 0 0 0;z-index:24;background:var(--surface);border-top:1px solid var(--line);
  padding-bottom:env(safe-area-inset-bottom,0px);padding-left:max(8px,env(safe-area-inset-left,0px));padding-right:max(8px,env(safe-area-inset-right,0px))}
.nav-in{max-width:620px;margin:0 auto;display:grid;grid-template-columns:repeat(5,minmax(0,1fr))}
.nav button{background:none;border:0;display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 2px 7px;font-size:12px;color:var(--muted);min-height:58px}
.nav button svg{width:23px;height:23px}
.nav button[aria-current="page"]{color:var(--water);font-weight:700}

/* forms */
.inp{width:100%;box-sizing:border-box;min-height:50px;border:1.5px solid var(--line);background:var(--surface-2);border-radius:12px;padding:10px 14px;font-size:17px}
.inp:focus{border-color:var(--water);outline:none}
textarea.inp{min-height:70px;resize:vertical}
.codein{text-align:center;font-family:var(--font-display);font-weight:800;font-size:30px;letter-spacing:.3em;min-height:62px}
.field{display:flex;flex-direction:column;gap:8px}
.lbl{font-weight:700;font-size:14.5px}
.seg{display:grid;gap:8px}
.seg.two{grid-template-columns:1fr 1fr} .seg.three{grid-template-columns:repeat(3,1fr)} .seg.four{grid-template-columns:repeat(4,1fr)}
.sb{min-height:50px;border:1.5px solid var(--line);background:var(--surface-2);border-radius:12px;padding:8px 6px;font-weight:600;font-size:15px}
.sb[aria-pressed="true"]{border-color:var(--water);background:var(--water-soft);color:var(--water)}
.sb.owedsel[aria-pressed="true"]{border-color:var(--owed);background:var(--owed-soft);color:var(--owed)}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.tbtn{display:flex;flex-direction:column;align-items:flex-start;gap:1px;text-align:right;min-height:62px;border:1.5px solid var(--line);background:var(--surface-2);border-radius:12px;padding:8px 12px}
.tbtn b{font-size:16px} .tbtn span{font-size:12.5px;color:var(--muted)}
.tbtn[aria-pressed="true"]{border-color:var(--water);background:var(--water-soft)}
.picklist{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:12px;overflow:hidden}
.pick{display:flex;justify-content:space-between;align-items:center;gap:10px;background:var(--surface);border:0;text-align:right;padding:10px 14px;min-height:54px}
.pick+.pick{border-top:1px solid var(--line)}
.pick .nm{display:flex;align-items:center;gap:10px;min-width:0}
.pick .nm .code{font-size:19px}
.pick .nm small{color:var(--muted);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pick.add{color:var(--water);font-weight:700;justify-content:center}
.picked{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;border:1.5px solid var(--water);background:var(--water-soft);border-radius:12px;padding:12px 14px}
.picked .code{font-size:24px}
.link{background:none;border:0;color:var(--water);font-weight:700;padding:6px 4px}
.price{display:flex;align-items:center;gap:8px}
.price input{flex:1;text-align:center;font-family:var(--font-display);font-weight:800;font-size:28px;min-height:58px}
.step{width:58px;min-height:58px;border-radius:12px;border:1.5px solid var(--line);background:var(--surface-2);font-weight:700;font-size:16px;flex:none}
.btn{min-height:52px;border-radius:12px;border:1.5px solid var(--line);background:var(--surface-2);font-weight:700;padding:10px 14px;display:inline-flex;align-items:center;justify-content:center;gap:8px;text-decoration:none;color:var(--ink);text-align:center}
.btn.primary{background:var(--water);border-color:var(--water);color:var(--water-ink);font-family:var(--font-display);font-size:17px}
.btn.primary:disabled{opacity:.45}
.btn.danger{color:var(--bad);border-color:var(--bad)}
.btn.full{width:100%}
.btn.small{min-height:40px;padding:6px 12px;font-size:14px}
.warnbox{background:var(--bad-soft);color:var(--bad);border-radius:12px;padding:10px 14px;font-size:14.5px;font-weight:600}
.infobox{background:var(--water-soft);color:var(--water);border-radius:12px;padding:10px 14px;font-size:14.5px}
.notebox{background:var(--owed-soft);color:var(--owed);border-radius:12px;padding:10px 14px;font-size:14.5px}
.hint{font-size:13.5px;color:var(--muted)}
.toggle{display:flex;align-items:center;justify-content:space-between;gap:10px;min-height:50px;border:1.5px solid var(--line);background:var(--surface-2);border-radius:12px;padding:8px 14px;text-align:right;width:100%}
.toggle .sw{width:44px;height:26px;border-radius:99px;background:var(--line);position:relative;flex:none;transition:background .15s}
.toggle .sw::after{content:"";position:absolute;top:3px;right:3px;width:20px;height:20px;border-radius:50%;background:var(--surface);transition:right .15s}
.toggle[aria-checked="true"] .sw{background:var(--water)}
.toggle[aria-checked="true"] .sw::after{right:21px}
.inline{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
details.more-opts summary{cursor:pointer;color:var(--water);font-weight:700;padding:4px 0;list-style:none}
details.more-opts summary::-webkit-details-marker{display:none}
details.more-opts[open] summary{margin-bottom:10px}

/* sheet */
#sheetWrap{position:fixed;inset:0;z-index:50}
.backdrop{position:absolute;inset:0;background:rgba(3,20,26,.45);border:0;width:100%}
.sheet{position:absolute;inset:auto 0 0 0;margin:0 auto;max-width:620px;max-height:92%;overflow:auto;background:var(--surface);border-radius:20px 20px 0 0;
  padding-bottom:calc(20px + env(safe-area-inset-bottom,0px));box-shadow:0 -10px 40px rgba(0,0,0,.25)}
.sheet-head{position:sticky;top:0;z-index:2;background:var(--surface);display:flex;align-items:center;justify-content:space-between;gap:8px;border-bottom:1px solid var(--line);
  padding-block:14px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.sheet-head h2{font-size:18px}
.x{width:40px;height:40px;border-radius:50%;border:1px solid var(--line);background:var(--surface-2);font-size:16px;flex:none}
#sheetBody{display:flex;flex-direction:column;gap:18px;padding-block:16px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

.balance{display:flex;flex-direction:column;gap:4px;background:var(--surface-2);border:1px solid var(--line);border-radius:var(--r);padding:14px}
.balance .big{font-family:var(--font-display);font-weight:800;font-size:30px;line-height:1.3}
.acts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:15px;margin:0}
.kv dt{color:var(--muted)} .kv dd{margin:0;font-weight:600;min-width:0;overflow-wrap:anywhere}
.filters{display:flex;gap:8px;overflow-x:auto;padding-bottom:2px}
.filters .sb{min-height:40px;padding:4px 14px;white-space:nowrap;font-size:14px}
.catgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.catgrid button{min-height:62px;border-radius:12px;border:1.5px solid var(--line);background:var(--surface-2);font-weight:600;font-size:14px;padding:6px}
.catgrid button.alt{border-style:dashed}
.bars{display:flex;flex-direction:column;gap:10px}
.barrow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 10px;font-size:14.5px}
.barrow .track{grid-column:1/-1;height:8px;background:var(--surface-2);border-radius:99px;overflow:hidden}
.barrow .track i{display:block;height:100%;background:var(--water);border-radius:99px}
.monthbar{display:flex;align-items:center;justify-content:space-between;gap:8px}
.mbtn{width:46px;height:46px;border-radius:12px;border:1.5px solid var(--line);background:var(--surface);font-size:20px;flex:none}
.mbtn:disabled{opacity:.35}
.profit{display:flex;flex-direction:column;gap:2px;padding:16px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
.profit .big{font-family:var(--font-display);font-weight:800;font-size:34px;line-height:1.25}
.profit .big.neg{color:var(--bad)}
.lines{display:flex;flex-direction:column}
.line{display:flex;justify-content:space-between;gap:10px;padding:10px 14px;font-size:15px}
.line+.line{border-top:1px solid var(--line)}
.line b{font-variant-numeric:tabular-nums;white-space:nowrap}
.line.total{font-weight:800;background:var(--surface-2)}
.line.subl{padding-right:28px;color:var(--muted);font-size:14px}
.tbl-wrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:14px;min-width:520px}
th,td{padding:9px 10px;text-align:right;border-bottom:1px solid var(--line);white-space:nowrap}
th{font-weight:600;color:var(--muted);font-size:12.5px;background:var(--surface-2)}
td.hl{color:var(--owed);font-weight:700}
.chart svg{width:100%;height:auto;display:block}
.legend{display:flex;gap:14px;font-size:13px;color:var(--muted);padding:0 14px 12px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-left:5px;vertical-align:-1px}
.person{display:flex;flex-direction:column;gap:10px;padding:14px}
.person+.person{border-top:1px solid var(--line)}
.person-h{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.person-h b{font-size:16px}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.stat{background:var(--surface-2);border-radius:10px;padding:8px 10px;display:flex;flex-direction:column;min-width:0}
.stat span{font-size:12px;color:var(--muted)} .stat b{font-variant-numeric:tabular-nums}
.dates{display:flex;flex-wrap:wrap;gap:6px}
.statement{white-space:pre-wrap;font-size:14px;background:var(--surface-2);border:1px solid var(--line);border-radius:12px;padding:12px;max-height:300px;overflow:auto;margin:0;font-family:var(--font-body)}

/* closing */
.close-card .person-h .chip{font-size:13px}
.calc{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:12px;overflow:hidden}
.calc .line{padding:8px 12px;font-size:14.5px}
.calc .line.total{font-size:16px}
.tripmini{display:flex;flex-wrap:wrap;gap:6px}
.tripmini button{border:1px solid var(--line);background:var(--surface-2);border-radius:10px;padding:4px 10px;font-size:13px;display:inline-flex;gap:6px;align-items:center}
.done-mark{display:flex;align-items:center;gap:8px;color:var(--ok);font-weight:700}

/* login */
.login{max-width:420px;margin:0 auto;display:flex;flex-direction:column;gap:18px;padding-block:40px 60px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.login .logo{width:64px;height:64px;color:var(--water)}
.login h1{font-family:var(--font-display);font-weight:800;font-size:26px;margin:0}
.pin{letter-spacing:.5em;text-align:center;font-size:26px;font-family:var(--font-display);font-weight:800}

#toast{position:fixed;z-index:60;left:50%;transform:translateX(-50%);bottom:calc(140px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);
  padding:12px 18px;border-radius:12px;font-weight:600;max-width:calc(100% - 40px);text-align:center;box-shadow:0 8px 24px rgba(0,0,0,.25)}
@media (max-width:380px){.tile .big{font-size:19px}.seg.four{grid-template-columns:repeat(2,1fr)}.catgrid{grid-template-columns:repeat(2,minmax(0,1fr))}.quick button{font-size:13px}}
@media (prefers-reduced-motion:no-preference){.sheet{animation:up .22s ease-out}@keyframes up{from{transform:translateY(30px);opacity:.6}to{transform:none;opacity:1}}}
</style>
<script src="config.js"></script>
</head>
<body>

<div id="app" dir="rtl" lang="ar">
  <header class="top">
    <div class="top-in">
      <div class="brand">
        <svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M12 2.5c3.6 4.3 6.5 8 6.5 11.3A6.5 6.5 0 0 1 12 20.3a6.5 6.5 0 0 1-6.5-6.5C5.5 10.5 8.4 6.8 12 2.5Z" fill="currentColor"/><path d="M8.6 14.2a3.4 3.4 0 0 0 3.4 3.3" stroke="var(--surface)" stroke-width="1.6" stroke-linecap="round"/></svg>
        <span id="bizName">دفتر الوايتات</span>
      </div>
      <button class="sync" id="syncBtn" data-act="go" data-v="more" aria-label="حالة المزامنة"><i></i><span id="syncTxt">...</span></button>
    </div>

<script>
(function(){
'use strict';
/* =================== config & storage =================== */
var API=String(window.SHIB_API||'').trim();
var DEMO=!API;
var NS=DEMO?'shib2demo.':'shib2.';
var TABLES=['settings','clients','workers','trucks','shibs','trips','payments','expenses','workerTx','handovers','lost'];
var DEF={businessName:'دفتر الوايتات',defaultPrice:'',commNormal:'2',commOT:'10',lunch:'10',lunchFrom:'12:00',lunchTo:'15:00',
  shift1End:'20:00',shift2End:'00:00',dayCutoff:'04:00',waterCost:'0',waterBy:'worker',dieselAmount:'150',
  unpaidAlert:'6',alertDays:'30',oilEvery:'50',
  remindText:'السلام عليكم ورحمة الله، لاهنت السداد. عليك {n} ردود ماء. الله يعطيك العافية',reportPhone:''};
var PREMISES=['خزان','مسبح','رشاش','ماطور'];
var REMIND={count:'لما توصل الردود للحد',start:'أول الشهر',mid:'نص الشهر',salary:'بعد الراتب (27)'};
var METHOD={credit:'آجل',cash:'كاش',transfer:'تحويل',balance:'من الرصيد',discount:'خصم'};
var CATS=[
  {id:'diesel',name:'ديزل (تفويل)',truck:true,sasco:true},
  {id:'maint',name:'صيانة وأعطال',truck:true},
  {id:'gov',name:'حكومية (إقامات، تأمين، استمارة)'},
  {id:'fine',name:'مخالفات',truck:true},
  {id:'misc',name:'متفرقات'},
  {id:'shibpay',name:'سداد حساب شيب',nocost:true,from:true,shib:true},
  {id:'sasco',name:'شحن محفظة ساسكو',nocost:true,hidden:true},
  {id:'draw',name:'مسحوبات شخصية',nocost:true}];
var CAT={water:{id:'water',name:'تعبئة ماء'}};CATS.forEach(function(c){CAT[c.id]=c});
var TX={commission:'عمولة',salary:'راتب',advance:'سلفة',lunch:'بدل غداء'};
var LOSTR=['كل الوايتات مشغولة','المكان بعيد','ما فيه وايت يناسب المكان','أخرى'];

function rd(k){try{var v=localStorage.getItem(NS+k);return v?JSON.parse(v):null}catch(e){return null}}
function wr(k,v){try{localStorage.setItem(NS+k,JSON.stringify(v));return true}catch(e){return false}}
function emptyStore(){var s={};TABLES.forEach(function(t){s[t]={}});return s}
var S=rd('data')||emptyStore(),Q=rd('queue')||[],M=rd('meta')||{since:0,seq:0};
TABLES.forEach(function(t){if(!S[t])S[t]={}});
var VER=0;function touch(){VER++}
function persist(){var ok=wr('data',S)&&wr('queue',Q)&&wr('meta',M);if(!ok)toast('ذاكرة الجهاز ممتلئة، تأكد من المزامنة')}

/* =================== helpers =================== */
var DAY=864e5;
function pad(n){return String(n).padStart(2,'0')}
function iso(d){return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())}
function dn(s){var p=String(s).split('-');return Date.UTC(+p[0],+p[1]-1,+p[2])/DAY}
function diff(a,b){return Math.round(dn(b)-dn(a))}
function addD(s,n){var d=new Date(s+'T12:00:00');d.setDate(d.getDate()+n);return iso(d)}
function hm(t){if(!t)return 0;var p=String(t).split(':');return (+p[0]||0)*60+(+p[1]||0)}
function hhmm(m){m=((m%1440)+1440)%1440;return pad(Math.floor(m/60))+':'+pad(m%60)}
function t12(t){if(!t)return '';var m=((hm(t)%1440)+1440)%1440,h=Math.floor(m/60),ap=h<12?'ص':'م';h=h%12;if(h===0)h=12;return h+':'+pad(m%60)+' '+ap}
function nowHM(){var d=new Date();return pad(d.getHours())+':'+pad(d.getMinutes())}
function cutoff(){return hm(st('dayCutoff'))}
function workToday(){var d=new Date();if(d.getHours()*60+d.getMinutes()<cutoff())d=new Date(d.getTime()-DAY);return iso(d)}
function dayMin(t){var m=hm(t);return m<cutoff()?m+1440:m}
function fmt(n){n=Number(n)||0;return Math.round(n).toLocaleString('en-US')}
function N(x){var n=Number(x);return isFinite(n)?n:0}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function toNum(s){s=String(s==null?'':s).replace(/[٠-٩]/g,function(d){return '٠١٢٣٤٥٦٧٨٩'.indexOf(d)}).replace(/[۰-۹]/g,function(d){return '۰۱۲۳۴۵۶۷۸۹'.indexOf(d)}).replace(/[^\d.]/g,'');return s===''?0:+s||0}
function digits(s){return String(s==null?'':s).replace(/[٠-٩]/g,function(d){return '٠١٢٣٤٥٦٧٨٩'.indexOf(d)}).replace(/\D/g,'')}
function uid(p){return p+Date.now().toString(36)+Math.random().toString(36).slice(2,7)}
function sumBy(a,f){var s=0;for(var i=0;i<a.length;i++)s+=f(a[i])||0;return s}
function dfmt(s,opt){try{return new Intl.DateTimeFormat('ar-u-nu-latn',opt).format(new Date(s+'T12:00:00'))}catch(e){return s}}
function hijri(s){try{return new Intl.DateTimeFormat('ar-SA-u-ca-islamic-umalqura-nu-latn',{day:'numeric',month:'long',year:'numeric'}).format(new Date(s+'T12:00:00'))}catch(e){return ''}}
function dayLabel(s){var d=diff(s,workToday());if(d===0)return 'اليوم';if(d===1)return 'أمس';return dfmt(s,{day:'numeric',month:'short'})}
function monthName(m){return dfmt(m+'-15',{month:'long',year:'numeric'})}
function monthShort(m){return dfmt(m+'-15',{month:'short'})}
function dim(m){var p=m.split('-');return new Date(+p[0],+p[1],0).getDate()}
function intlPhone(p){p=digits(p);if(!p)return '';if(p.indexOf('00')===0)p=p.slice(2);if(p.indexOf('966')===0)return p;if(p.charAt(0)==='0')p=p.slice(1);if(p.length===9&&p.charAt(0)==='5')return '966'+p;return p}
function wa(p,msg){var n=intlPhone(p);return 'https://wa.me/'+(n||'')+'?text='+encodeURIComponent(msg)}
function openUrl(u){var w=null;try{w=window.open(u,'_blank','noopener')}catch(e){}if(!w){var a=document.createElement('a');a.href=u;a.target='_blank';a.rel='noopener';document.body.appendChild(a);a.click();a.remove()}}

function st(k){var r=S.settings['set_'+k];return r&&r.value!==undefined&&r.value!==''?String(r.value):(DEF[k]!==undefined?DEF[k]:'')}
function sn(k){return N(st(k))}
function rows(t){var o=S[t],a=[];for(var k in o)a.push(o[k]);return a}
function live(r){return r.status!=='cancel'}
function isPend(t){return t.status==='pending'}
function shibOn(s){return String(s.active)!=='0'}
function canEdit(){return DEMO||M.role==='admin'}

/* =================== mutations & sync =================== */
function put(t,row){
  if(!canEdit()){toast('صلاحيتك مشاهدة فقط');return null}
  if(!row.id)row.id=uid(t.slice(0,2));
  S[t][row.id]=row;
  if(!DEMO){Q=Q.filter(function(q){return !(q.t===t&&q.row.id===row.id)});Q.push({s:++M.seq,t:t,row:JSON.parse(JSON.stringify(row))})}
  touch();persist();scheduleSync(700);
  return row;
}
function setSetting(k,v){put('settings',{id:'set_'+k,key:k,value:String(v)})}

var syncing=false,syncTimer=null,lastErr='',online=navigator.onLine!==false;
function scheduleSync(ms){if(DEMO)return;clearTimeout(syncTimer);syncTimer=setTimeout(function(){sync(false)},ms||0)}
function post(body){
  return fetch(API,{method:'POST',body:JSON.stringify(body),redirect:'follow'}).then(function(r){if(!r.ok)throw new Error('HTTP '+r.status);return r.json()});
}
function sync(full){
  if(DEMO||syncing||!M.name)return Promise.resolve();
  syncing=true;paintSync();
  var batch=Q.slice(0,150),seqs={};batch.forEach(function(q){seqs[q.s]=1});
  var body={action:'sync',name:M.name,pin:M.pin,since:full?0:(M.since||0),ops:batch.map(function(q){return {t:q.t,row:q.row}})};
  return post(body).then(function(res){
    online=true;
    if(!res.ok){
      lastErr=res.error||'خطأ';
      if(res.auth){M.pin='';persist();toast('الرمز تغير، سجل دخول من جديد');syncing=false;boot();return}
      throw new Error(lastErr);
    }
    lastErr='';
    Q=Q.filter(function(q){return !seqs[q.s]});
    var pend={};Q.forEach(function(q){pend[q.t+'|'+q.row.id]=1});
    Object.keys(res.rows||{}).forEach(function(t){
      if(!S[t])return;
      if(full){var keep={};for(var id in S[t]){if(pend[t+'|'+id])keep[id]=S[t][id]}S[t]=keep}
      res.rows[t].forEach(function(r){if(!pend[t+'|'+r.id])S[t][r.id]=r});
    });
    M.since=res.rev;M.role=res.role||M.role;M.lastSync=Date.now();if(full)M.lastFull=workToday();
    touch();persist();syncing=false;render(true);
    if(Q.length)scheduleSync(300);
  }).catch(function(e){
    syncing=false;online=false;lastErr=lastErr||'ما قدر يوصل للملف. يحاول مرة ثانية بعد شوي';paintSync();
    clearTimeout(syncTimer);syncTimer=setTimeout(function(){sync(false)},30000);
  });
}
function paintSync(){
  var b=document.getElementById('syncBtn'),t=document.getElementById('syncTxt');
  b.className='sync';
  if(DEMO){b.classList.add('demo');t.textContent='تجريبي';return}
  if(syncing){b.classList.add('pending');t.textContent='يرسل...';return}
  if(Q.length){b.classList.add(online?'pending':'off');t.textContent=Q.length+' بانتظار الإرسال';return}
  if(!online){b.classList.add('off');t.textContent='بدون نت';return}
  t.textContent='متزامن';
}
window.addEventListener('online',function(){online=true;scheduleSync(200)});
window.addEventListener('offline',function(){online=false;paintSync()});
document.addEventListener('visibilitychange',function(){if(document.visibilityState==='visible')scheduleSync(100)});
if(!DEMO)setInterval(function(){if(document.visibilityState==='visible'&&M.name&&M.pin)sync(false)},60000);

/* =================== derived data =================== */
var DV=-1,D=null;
function derive(){
  if(DV===VER&&D)return D;
  var all=rows('trips').sort(function(a,b){var x=a.date+(dayMin(a.time)+10000),y=b.date+(dayMin(b.time)+10000);return x<y?-1:x>y?1:0});
  var d={tr:all.filter(function(t){return !isPend(t)}),pend:all.filter(isPend)};
  d.pay=rows('payments').filter(live);d.exp=rows('expenses').filter(live);d.tx=rows('workerTx').filter(live);
  d.ho=rows('handovers').filter(live);d.lost=rows('lost').filter(live);
  d.clients=rows('clients');d.workers=rows('workers');d.trucks=rows('trucks');
  d.cs={};
  d.clients.forEach(function(c){d.cs[c.id]={items:[],paid:0,owed:N(c.openAmount),n:0,last:null,dates:[]}});
  function cs(id){return d.cs[id]||(d.cs[id]={items:[],paid:0,owed:0,n:0,last:null,dates:[]})}
  d.dw={};
  function dw(w,day){var k=day+'|'+w;return d.dw[k]||(d.dw[k]={trips:[],cash:0,water:0,exp:0,txCash:0,commPaid:0,ho:0,closed:false,expected:null})}
  d.tr.forEach(function(t){
    var c=cs(t.clientId),o=owed(t);
    c.owed+=o;c.paid+=N(t.paid);
    if(o>0)c.items.push({date:t.date,amount:o,trip:t});
    if(t.status!=='cancel'){c.n++;c.last=t;if(c.dates[c.dates.length-1]!==t.date)c.dates.push(t.date)}
    if(t.workerId){var x=dw(t.workerId,t.date);x.trips.push(t);if(t.method==='cash')x.cash+=N(t.paid);if(N(t.water)>0&&(t.waterBy||'worker')==='worker')x.water+=N(t.water)}
  });
  d.pay.forEach(function(p){var c=cs(p.clientId);c.paid+=N(p.amount);if(p.receivedBy&&p.method==='cash')dw(p.receivedBy,p.date).cash+=N(p.amount)});
  d.exp.forEach(function(e){if(e.paidFrom==='worker'&&e.workerId)dw(e.workerId,e.date).exp+=N(e.amount)});
  d.tx.forEach(function(x){var y=dw(x.workerId,x.date);if(x.type==='lunch'){y.lunch=(y.lunch||0)+N(x.amount);return}if(N(x.fromCash))y.txCash+=N(x.amount);if(x.type==='commission')y.commPaid+=N(x.amount)});
  d.ho.forEach(function(h){var y=dw(h.workerId,h.date);y.ho+=N(h.amount);y.closed=true;y.expected=N(h.expected)});
  // client balances, FIFO unpaid count
  Object.keys(d.cs).forEach(function(id){
    var c=d.cs[id],cl=S.clients[id]||{},items=[];
    var oc=N(cl.openCount),oa=N(cl.openAmount);
    if(oa>0){var k=Math.max(1,oc);for(var i=0;i<k;i++)items.push({date:'',amount:oa/k,open:true})}
    items=items.concat(c.items);
    var left=c.paid,unpaid=[];
    items.forEach(function(it){if(left>=it.amount-0.001){left-=it.amount}else{unpaid.push({date:it.date,amount:it.amount-left,open:it.open,trip:it.trip});left=0}});
    c.bal=c.owed-c.paid;c.unpaid=unpaid;c.count=unpaid.length;
    c.oldest=unpaid.filter(function(u){return u.date}).map(function(u){return u.date})[0]||(unpaid.length?'old':null);
    if(c.dates.length>=5){var g=0;for(var j=1;j<c.dates.length;j++)g+=diff(c.dates[j-1],c.dates[j]);c.avg=g/(c.dates.length-1)}
  });
  d.months={};d.tr.forEach(function(t){d.months[t.date.slice(0,7)]=1});d.months[workToday().slice(0,7)]=1;
  D=d;DV=VER;return d;
}
function owed(t){return isPend(t)?0:t.status==='cancel'?N(t.charge):N(t.price)-N(t.discount)}
function earnsComm(t){return t.status!=='cancel'||N(t.comm)>0}
function commDay(x){return sumBy(x.trips,function(t){return earnsComm(t)?N(t.comm):0})+N(x.lunch)}
function clientLabel(c){if(!c)return '؟';return (c.code||'----')+(c.name?' · '+c.name:'')}
function workerOfTruck(tid){var w=rows('workers').filter(function(w){return w.truckId===tid&&w.status!=='موقوف'});return w.filter(function(x){return x.status!=='إجازة'})[0]||w[0]||null}
function truckLabel(t){if(!t)return '';var w=workerOfTruck(t.id);return t.name||(w?'وايت '+w.name:'وايت')}
function isOT(time,w){var end=hm((w&&N(w.shift)===2)?st('shift2End'):st('shift1End'));if(end<=cutoff())end+=1440;return dayMin(time)>=end}
function commFor(ot){return ot?sn('commOT'):sn('commNormal')}
function custody(wid,beforeDate){
  var d=derive(),s=0;
  Object.keys(d.dw).forEach(function(k){var p=k.split('|');if(p[1]!==wid)return;if(beforeDate&&p[0]>=beforeDate)return;var x=d.dw[k];s+=x.cash-x.water-x.exp-x.txCash-x.ho});
  return s;
}
function workerSpan(w){var d=derive();var first=d.tr.length?d.tr[0].date:workToday();return {a:w.startDate||first,b:w.endDate||'9999-12-31'}}
function salaryIn(w,a,b){
  var sal=N(w.salary);if(!sal)return 0;var sp=workerSpan(w);
  var from=a>sp.a?a:sp.a,to=b<sp.b?b:sp.b;if(from>to)return 0;
  var tot=0,cur=from;
  while(cur<=to){var m=cur.slice(0,7),end=m+'-'+pad(dim(m)),e=end<to?end:to;tot+=sal*(diff(cur,e)+1)/dim(m);cur=addD(end,1)}
  return tot;
}
function workerLedger(w){
  var d=derive(),today=workToday(),comm=0,days=0;
  Object.keys(d.dw).forEach(function(k){var p=k.split('|');if(p[1]===w.id){comm+=commDay(d.dw[k])}});
  var sal=salaryIn(w,'0000-01-01',today);
  var paid={commission:0,salary:0,advance:0};d.tx.forEach(function(x){if(x.workerId===w.id)paid[x.type]=(paid[x.type]||0)+N(x.amount)});
  return {comm:comm,sal:sal,paid:paid,net:comm+sal-paid.commission-paid.salary-paid.advance};
}
function periodStats(a,b){
  var d=derive(),r={n:0,ot:0,rev:0,disc:0,owedSum:0,paidAt:0,pays:0,water:0,comm:0,sal:0,exp:{},expTot:0,draw:0,sasco:0,dieselSasco:0,cancel:0,lost:0,byW:{}};
  d.tr.forEach(function(t){if(t.date<a||t.date>b)return;
    if(t.status==='cancel')r.cancel++;else{r.n++;if(N(t.ot))r.ot++}
    r.rev+=t.status==='cancel'?N(t.charge):N(t.price);if(t.status!=='cancel')r.disc+=N(t.discount);r.owedSum+=owed(t);r.paidAt+=N(t.paid);r.water+=N(t.water);
    var w=r.byW[t.workerId]||(r.byW[t.workerId]={n:0,rev:0,water:0,comm:0,diesel:0,trucks:{}});
    if(t.status!=='cancel')w.n++;w.rev+=owed(t);w.water+=N(t.water);if(t.truckId)w.trucks[t.truckId]=1;
  });
  Object.keys(d.dw).forEach(function(k){var p=k.split('|');if(p[0]<a||p[0]>b)return;var c=commDay(d.dw[k]);r.comm+=c;var w=r.byW[p[1]]||(r.byW[p[1]]={n:0,rev:0,water:0,comm:0,diesel:0,trucks:{}});w.comm+=c});
  d.pay.forEach(function(p){if(p.date<a||p.date>b)return;if(p.method==='discount')r.disc+=N(p.amount);else r.pays+=N(p.amount)});
  d.exp.forEach(function(e){if(e.date<a||e.date>b)return;var amt=N(e.amount);
    if(e.cat==='draw'){r.draw+=amt;return}if(e.cat==='sasco'){r.sasco+=amt;return}
    if(e.cat==='diesel'&&e.paidFrom==='sasco')r.dieselSasco+=amt;
    r.exp[e.cat]=(r.exp[e.cat]||0)+amt;r.expTot+=amt;
    if(e.cat==='diesel'){var wid=e.workerId||(workerOfTruck(e.truckId)||{}).id;if(wid){var w=r.byW[wid]||(r.byW[wid]={n:0,rev:0,water:0,comm:0,diesel:0,trucks:{}});w.diesel+=amt}}
  });
  var today=workToday(),bb=b>today?today:b;
  d.workers.forEach(function(w){r.sal+=salaryIn(w,a,bb)});
  d.lost.forEach(function(l){if(l.date>=a&&l.date<=b)r.lost++});
  r.costs=r.water+r.comm+r.sal+r.expTot;r.profit=r.rev-r.disc-r.costs;r.net=r.profit-r.draw;
  r.collected=r.paidAt+r.pays;r.newCredit=r.owedSum-r.paidAt;
  return r;
}
function sascoBalance(){var d=derive();return sumBy(d.exp,function(e){return e.cat==='sasco'?N(e.amount):0})-sumBy(d.exp,function(e){return e.cat==='diesel'&&e.paidFrom==='sasco'?N(e.amount):0})}

/* =================== alerts =================== */
function alerts(){
  var d=derive(),out=[],today=workToday(),days=sn('alertDays')||30;
  function due(name,date,go,o){if(!date)return;var dl=diff(today,date);if(dl<0)out.push({lv:'bad',t:name,s:'انتهت قبل '+(-dl)+' يوم',act:go,o:dl});else if(dl<=days)out.push({lv:'warn',t:name,s:'تنتهي بعد '+dl+' يوم ('+dfmt(date,{day:'numeric',month:'short'})+')',act:go,o:dl})}
  d.trucks.forEach(function(t){var n=truckLabel(t);due('استمارة '+n,t.istimara,'trucks');due('فحص '+n,t.inspection,'trucks');due('تأمين '+n,t.insurance,'trucks');due('كرت تشغيل '+n,t.opCard,'trucks');
    if(t.status!=='واقف'&&t.lastOil){var nx=addD(t.lastOil,N(t.oilEvery)||sn('oilEvery')||50),dl=diff(today,nx);if(dl<=7)out.push({lv:dl<0?'bad':'warn',t:'تغيير زيت '+n,s:dl<0?'متأخر '+(-dl)+' يوم':'بعد '+dl+' أيام',act:'trucks',o:dl})}});
  d.workers.forEach(function(w){if(w.status==='موقوف')return;if(N(w.iqamaOnUs)){due('إقامة '+w.name,w.iqamaDate,'workers');due('تأمين '+w.name,w.insuranceDate,'workers')}});
  var yd=addD(today,-1);
  d.workers.forEach(function(w){if(w.status==='موقوف')return;
    var x=d.dw[yd+'|'+w.id];if(x&&x.trips.length&&!x.closed){out.push({lv:'warn',t:'ما تقفل حساب '+w.name+' أمس',s:x.trips.length+' ردود',act:'closing',arg:yd,o:-2});return}
    var c=custody(w.id,today);if(Math.abs(c)>=1)out.push({lv:'warn',t:(c>0?'عند ':'لـ')+w.name+' '+fmt(Math.abs(c))+' ريال من أيام سابقة',s:c>0?'ما انستلمت':'دفعها من جيبه',act:'closing',o:-1});
  });
  var th=sn('unpaidAlert')||6,dom=+today.slice(8,10);
  d.clients.forEach(function(c){var x=d.cs[c.id];if(!x||x.count<1||x.bal<=0)return;
    if(c.lastReminded&&diff(c.lastReminded,today)<5)return;
    var win=c.remind==='start'?dom<=5:c.remind==='mid'?(dom>=13&&dom<=17):c.remind==='salary'?(dom>=26||dom<=2):false;
    var old=x.oldest&&x.oldest!=='old'?diff(x.oldest,today):0;
    if(x.count>=th||win||old>=90)out.push({lv:old>=60||x.count>=th*2?'bad':'warn',t:'ذكّر '+clientLabel(c)+' بالسداد',s:'عليه '+x.count+' ردود'+(old>=30?' · أقدمها من '+old+' يوم':'')+(win&&x.count<th?' · '+REMIND[c.remind]:''),act:'client',id:c.id,o:5});
  });
  d.clients.forEach(function(c){var x=d.cs[c.id];if(!x||!x.avg||x.avg>21||!x.last)return;var since=diff(x.last.date,today);
    if(since>=Math.ceil(x.avg)&&since<=x.avg*2.5)out.push({lv:'info',t:clientLabel(c)+' قرب موعد طلبه',s:'يطلب كل '+Math.round(x.avg)+' أيام تقريبا، آخر رد قبل '+since+' يوم',act:'client',id:c.id,o:60})});
  var rank={bad:0,warn:1,info:2};return out.sort(function(a,b){return rank[a.lv]-rank[b.lv]||a.o-b.o});
}

/* =================== small UI pieces =================== */
function chipM(t){
  if(isPend(t))return '<span class="chip c-water">بالانتظار</span>';
  if(t.status==='cancel')return '<span class="chip c-bad">ملغي</span>';
  if(t.method==='balance')return '<span class="chip c-ok">من الرصيد</span>';
  var p=N(t.paid),o=owed(t);
  if(t.method==='credit'||p<=0)return '<span class="chip c-owed">آجل</span>';
  if(p<o)return '<span class="chip c-owed">'+METHOD[t.method]+' جزئي</span>';
  return '<span class="chip '+(t.method==='cash'?'c-ok':'c-water')+'">'+METHOD[t.method]+(N(t.discount)>0?' + خصم':'')+'</span>';
}
function tripRow(t,showDate){
  var c=S.clients[t.clientId],w=S.workers[t.workerId];
  return '<li><button class="row" data-act="trip" data-id="'+t.id+'"><span class="time">'+(showDate?dayLabel(t.date):t12(t.time))+'</span>'+
    '<span class="main"><b><span class="code">'+esc(c?c.code:'----')+'</span>'+(c&&c.name?' · '+esc(c.name):'')+'</b><small>'+esc(w?w.name:(t.workerName||''))+(N(t.ot)?' · أوفرتايم':'')+'</small></span>'+
    '<span class="amt"><span class="'+(t.status==='cancel'?'strike':'')+'">'+fmt(t.price)+'</span>'+chipM(t)+'</span></button></li>';
}
function seg(act,v,label,cur,cls){return '<button class="sb '+(cls||'')+'" data-act="'+act+'" data-v="'+esc(v)+'" aria-pressed="'+(String(cur)===String(v))+'">'+label+'</button>'}
function tog(act,label,on,v){return '<button class="toggle" role="switch" data-act="'+act+'"'+(v!==undefined?' data-v="'+esc(v)+'"':'')+' aria-checked="'+(!!on)+'"><span>'+label+'</span><span class="sw"></span></button>'}
function dateChip(label,date){if(!date)return '<span class="chip c-mute">'+label+': ما انحط</span>';var dl=diff(workToday(),date);var cls=dl<0?'c-bad':dl<=(sn('alertDays')||30)?'c-owed':'c-mute';return '<span class="chip '+cls+'">'+label+': '+(dl<0?'منتهية':dfmt(date,{day:'numeric',month:'short',year:'numeric'}))+'</span>'}
function trucksFor(premise){
  var all=rows('trucks').filter(function(t){return t.status!=='واقف'});
  if(premise==='مسبح'){var a=all.filter(function(t){return N(t.canPool)});return {list:a.length?a:all,warn:!a.length}}
  if(premise==='رشاش'||premise==='ماطور'){var b=all.filter(function(t){return N(t.canSpray)});return {list:b.length?b:all,warn:!b.length}}
  return {list:all,warn:false};
}

function closeCard(w,day,tot){
  var d=derive(),x=d.dw[day+'|'+w.id]||{trips:[],cash:0,water:0,exp:0,txCash:0,commPaid:0,ho:0,closed:false};
  var trips=x.trips,done=trips.filter(function(t){return t.status!=='cancel'}),ot=done.filter(function(t){return N(t.ot)}).length;
  var comm=commDay(x),lunch=N(x.lunch),prev=custody(w.id,day);
  var truck=truckForDay(w,day);
  var dieselLogged=d.exp.filter(function(e){return e.cat==='diesel'&&e.date===day&&(e.workerId===w.id||(truck&&e.truckId===truck.id))});
  var commLeft=Math.max(0,comm-x.commPaid);
  var takeComm=CL[w.id+'|'+day]===undefined?true:CL[w.id+'|'+day];
  var expected=prev+x.cash-x.water-x.exp-x.txCash-x.ho-(x.closed?0:(takeComm?commLeft:0));
  tot.ho+=x.ho;d.ho.forEach(function(r){if(r.workerId===w.id&&r.date===day){if(N(r.amount)>0)tot.hoIn+=N(r.amount);else tot.hoOut-=N(r.amount)}});
  var h='<section class="card close-card"><div class="person"><div class="person-h"><div><b>'+esc(w.name)+'</b><div class="sub">'+esc(truck?truckLabel(truck):'بدون وايت')+' · وردية '+(N(w.shift)===2?'الظهر':'الصبح')+'</div></div>'+
    (x.closed?'<span class="chip c-ok">تقفل</span>':trips.length?'<span class="chip c-owed">ما تقفل</span>':'<span class="chip c-mute">'+esc(w.status||'شغال')+'</span>')+'</div>';
  if(trips.length)h+='<div class="tripmini">'+trips.map(function(t){var c=S.clients[t.clientId];return '<button data-act="trip" data-id="'+t.id+'"><span class="code">'+esc(c?c.code:'----')+'</span>'+chipM(t)+(N(t.ot)?'<span class="chip c-water">أوفر</span>':'')+'</button>'}).join('')+'</div>';
  h+='<div class="calc">'+
    '<div class="line"><span>الردود: '+done.length+(ot?' (منها '+ot+' أوفرتايم)':'')+'</span><b>عمولة '+fmt(comm-lunch)+(lunch?' + غداء '+fmt(lunch):'')+'</b></div>'+
    (Math.abs(prev)>=1?'<div class="line"><span>'+(prev>0?'باقي عنده من قبل':'له من قبل')+'</span><b>'+fmt(Math.abs(prev))+'</b></div>':'')+
    '<div class="line"><span>كاش استلمه من العملاء</span><b>+ '+fmt(x.cash)+'</b></div>'+
    (x.water?'<div class="line"><span>تعبئة الماء دفعها</span><b>− '+fmt(x.water)+'</b></div>':'')+
    (x.exp?'<div class="line"><span>مصاريف دفعها (ديزل وغيره)</span><b>− '+fmt(x.exp)+'</b></div>':'')+
    (x.txCash?'<div class="line"><span>أخذ من الكاش (عمولة/سلفة)</span><b>− '+fmt(x.txCash)+'</b></div>':'')+
    (x.ho>0?'<div class="line"><span>سلّم</span><b>− '+fmt(x.ho)+'</b></div>':x.ho<0?'<div class="line"><span>أعطيناه</span><b>+ '+fmt(-x.ho)+'</b></div>':'')+
    (!x.closed&&commLeft&&takeComm?'<div class="line"><span>عمولته اليوم من الكاش</span><b>− '+fmt(commLeft)+'</b></div>':'')+
    '<div class="line total"><span>'+(x.closed?(expected>0.5?'باقي عنده':expected<-0.5?'له عندنا':'الحساب مصفّى'):(expected>=0?'المفروض يسلّم':'نعطيه'))+'</span><b>'+fmt(Math.abs(expected))+'</b></div></div>';
  if(canEdit()&&!x.closed){
    h+=dieselHTML(w,day,truck,dieselLogged,true);
    h+=lunchTog(w,day,x);
    if(commLeft)h+=tog('takeComm','يأخذ عمولته '+fmt(commLeft)+' من الكاش',takeComm,w.id+'|'+day);
    h+='<div class="field"><div class="lbl">'+(expected>=0?'كم استلمت منه؟':'كم أعطيته؟')+'</div><div class="price"><input id="ho-'+w.id+'" class="inp" inputmode="decimal" value="'+esc(HO[day+'|'+w.id]!==undefined?HO[day+'|'+w.id]:Math.round(Math.abs(expected)))+'"></div></div>';
    h+='<button class="btn primary full" data-act="closeW" data-id="'+w.id+'" data-v="'+day+'">تقفيل حساب '+esc(w.name)+'</button>';
  }else if(canEdit()&&x.closed&&!dieselLogged.length&&truck&&trips.length){
    h+=dieselHTML(w,day,truck,dieselLogged,false);
  }
  if(canEdit()&&x.closed&&Math.abs(expected)>=1){
    h+='<button class="btn" data-act="closeMore" data-id="'+w.id+'" data-v="'+day+'">تسليم إضافي</button>';
  }
  h+='</div></section>';
  return h;
}
var CL={},HO={};
function truckForDay(w,day){var t=S.trucks[w.truckId];if(t)return t;var d=derive(),x=d.dw[day+'|'+w.id];var tr=x?x.trips.filter(function(r){return r.truckId&&S.trucks[r.truckId]}):[];return tr.length?S.trucks[tr[tr.length-1].truckId]:null}
function dieselHTML(w,day,truck,logged,cashOk){

function chartSVG(ms){

  var gw=(W-pad2*2)/data.length,bw=Math.min(22,gw/3),g='';
  data.forEach(function(x,i){var cx=W-pad2-gw*(i+0.5);
    [[x.a,'var(--water)',cx+2],[x.b,'var(--bar-2)',cx-bw-2]].forEach(function(v){var hh=(v[0]/max)*(H-top-bot),y=H-bot-hh;
      g+='<rect x="'+v[2].toFixed(1)+'" y="'+y.toFixed(1)+'" width="'+bw.toFixed(1)+'" height="'+Math.max(0,hh).toFixed(1)+'" rx="3" fill="'+v[1]+'"/>';
      g+='<text x="'+(v[2]+bw/2).toFixed(1)+'" y="'+(y-5).toFixed(1)+'" text-anchor="middle" font-size="10" fill="var(--muted)">'+(v[0]/1000).toFixed(1)+'</text>'});
    g+='<text x="'+cx.toFixed(1)+'" y="'+(H-8)+'" text-anchor="middle" font-size="12" fill="var(--ink)">'+monthShort(x.m)+'</text>'});
  g+='<line x1="'+pad2+'" x2="'+(W-pad2)+'" y1="'+(H-bot)+'" y2="'+(H-bot)+'" stroke="var(--line)"/>';
  return '<svg viewBox="0 0 '+W+' '+H+'" role="img" aria-label="الدخل والمصاريف لكل شهر بالألف ريال">'+g+'</svg>';
}

var F={};
function startTrip(cid,editId){
  if(editId){var t=S.trips[editId];F=JSON.parse(JSON.stringify(t));F.edit=true;F.q='';F.otManual=false;F.changeClient=false;
    F.restAs=N(t.discount)>0?'discount':'credit';F.paid=N(t.paid);F.water=N(t.water);F.waterBy=t.waterBy||'worker';F.shibId=t.shibId||'';
    if(isPend(t)){F.wasPending=true;F.mode='now';F.dueDate=t.date;F.dueTime=t.time;F.date=workToday();F.time=nowHM();F.sendWa=true;F.truckId=null;F.workerId=null;applyDefaults(true)}
    else{F.mode='now';F.timeOpen=true}
  }else F={clientId:null,truckId:null,workerId:null,shibId:'',water:0,waterBy:'worker',price:0,method:'credit',paid:0,restAs:'credit',time:nowHM(),date:workToday(),dueDate:addD(workToday(),1),dueTime:'',q:'',sendWa:true,timeOpen:false,otManual:false,ot:0,note:'',mode:'now'};
  if(cid&&!editId)pickClient(cid);
  openSheet(editId?(isPend(S.trips[editId])?'تطليع الطلب':'تعديل الرد'):'رد جديد',ntHTML);
}
function applyDefaults(keepPrice){
  var c=S.clients[F.clientId];if(!c)return;var x=derive().cs[c.id]||{},tf=trucksFor(c.premise);
  if(!F.truckId||!tf.list.some(function(t){return t.id===F.truckId})){F.truckId=null;F.workerId=null;
    if(tf.list.length===1)selTruck(tf.list[0].id);else if(x.last&&x.last.truckId&&tf.list.some(function(t){return t.id===x.last.truckId}))selTruck(x.last.truckId)}
  if(!keepPrice)F.price=x.last?N(x.last.price):sn('defaultPrice');
  F.method=x.bal<-0.5?'balance':(x.last&&x.last.method&&x.last.method!=='balance'?x.last.method:'credit');
  F.paid=(F.method==='cash'||F.method==='transfer')?N(F.price):0;F.restAs='credit';
  setShib(defaultShib(c.id,F.workerId));
  recalcOT();
}
function pickClient(id){
  F.clientId=id;F.changeClient=false;
  if(F.edit&&!F.wasPending){var c=S.clients[id],tf=trucksFor(c.premise);if(F.truckId&&!tf.list.some(function(t){return t.id===F.truckId})){F.truckId=null;F.workerId=null}return}
  applyDefaults(F.wasPending);
}
function selTruck(tid){F.truckId=tid;var w=workerOfTruck(tid);F.workerId=w?w.id:null;recalcOT()}
function recalcOT(){/* الأوفرتايم ما يتشغل تلقائي: الردود تنسجل بالليل، فيشغله راكان بيده للرد اللي فعلا أوفرتايم */}

function defaultShib(cid,wid){
  var d=derive(),i,t;
  for(i=d.tr.length-1;i>=0;i--){t=d.tr[i];if(t.clientId===cid&&t.shibId&&S.shibs[t.shibId]&&shibOn(S.shibs[t.shibId]))return t.shibId}
  if(wid)for(i=d.tr.length-1;i>=0;i--){t=d.tr[i];if(t.workerId===wid&&t.shibId&&S.shibs[t.shibId]&&shibOn(S.shibs[t.shibId]))return t.shibId}
  var a=activeShibs();return a.length?a[0].id:'';
}

function saveTrip(){
  var c=S.clients[F.clientId];if(!c){toast('اختر العميل');return}
  var price=N(F.price);if(!(price>0)){toast('اكتب السعر');return}
  var base=F.edit?JSON.parse(JSON.stringify(S.trips[F.id])):{id:uid('r')};
  base.clientId=c.id;base.clientLabel=clientLabel(c);base.price=price;base.note=F.note||'';
  if(!base.orderAt)base.orderAt=workToday()+' '+nowHM();
  if(F.mode!=='now'){
    base.status='pending';base.date=F.mode==='later'?(F.dueDate||workToday()):workToday();base.time=F.mode==='later'?(F.dueTime||'08:00'):nowHM();
    base.method='credit';base.paid=0;base.comm=0;base.water=0;base.discount=0;base.truckId=base.truckId||'';
    put('trips',base);closeSheet();render();toast(F.mode==='later'?'انحفظ الموعد '+dayLabel(base.date)+' '+t12(base.time):'انحفظ بالانتظار');return;
  }
  if(!F.truckId){toast('اختر الوايت');return}
  if(!F.workerId||!S.workers[F.workerId]){toast('اختر السواق');return}
  var w=S.workers[F.workerId],sh=S.shibs[F.shibId],method=F.method,paid=(method==='cash'||method==='transfer')?N(F.paid):0;
  if((method==='cash'||method==='transfer')&&paid<=0)method='credit';
  base.date=F.date||workToday();base.time=F.time||nowHM();base.truckId=F.truckId;base.workerId=F.workerId||'';base.workerName=w?w.name:'';
  base.method=method;base.paid=paid;base.discount=(method==='cash'||method==='transfer')&&F.restAs==='discount'&&price-paid>0?price-paid:0;
  base.ot=F.ot?1:0;base.shibId=sh?sh.id:'';base.shibName=sh?sh.name:'';base.water=N(F.water);base.waterBy=F.waterBy||'worker';
  if(base.status!=='cancel'){base.status='done';base.comm=commFor(base.ot)}
  put('trips',base);
  if(w&&!w.truckId&&!workerOfTruck(F.truckId)){var wl=JSON.parse(JSON.stringify(w));wl.truckId=F.truckId;put('workers',wl)}
  var x=derive().cs[c.id]||{};closeSheet();render();
  toast((F.wasPending?'طلع الرد لـ':F.edit?'انحفظ التعديل لـ':'انحفظ الرد لـ')+(c.code||'')+(x.count>0?'. عليه '+x.count+' ردود':x.bal<-0.5?'. باقي رصيده '+fmt(-x.bal):''));
  if((!F.edit||F.wasPending)&&F.sendWa&&w&&w.phone){openUrl(wa(w.phone,'رد جديد\nالعميل: '+clientLabel(c)+(c.premise&&c.premise!=='خزان'?'\nالمكان: '+c.premise:'')+(sh?'\nيعبي من: '+sh.name:'')+(c.location?'\nالموقع: '+c.location:'')+(base.note?'\nملاحظة: '+base.note:'')))}
}
